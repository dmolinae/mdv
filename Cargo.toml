[package]
name = "mdv"
version = "2.0.0"
edition = "2021"
authors = ["Daniel Molina <dmolinae@outlook.com>"]
description = "Modern Markdown & WSL Terminal workspace viewer for Windows and WSL2/Linux"
license = "MIT"
repository = "https://github.com/dmolinae/mdv"

[[bin]]
name = "mdv"
path = "src/main.rs"

[[bin]]
name = "mdv-setup"
path = "src/bin/mdv-setup.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
futures-util = "0.3"
mime_guess = "2.0"
portable-pty = "0.8"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
tao = "0.38"
wry = { version = "0.58", default-features = false, features = ["os-webview"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
