name: Release (Windows Installer & Linux Binary)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v2.0.0)"
        required: false
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux / WSL2 x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package tarball
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/mdv-linux-x86_64.tar.gz mdv
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/mdv-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows x64 + Inno Setup Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary (MSVC)
        run: cargo build --release --locked
      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target\release\mdv.exe, README.md, LICENSE -DestinationPath dist\mdv-windows-x86_64.zip -Force
      - name: Build Windows Setup Installer (mdv-setup-x64.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer\windows\mdv.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/mdv-setup-x64.exe
            dist/mdv-windows-x86_64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum mdv-setup-x64.exe mdv-windows-x86_64.zip mdv-linux-x86_64.tar.gz > checksums.txt
          ls -lh
      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v2.0.0' }}
          name: "mdv ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v2.0.0' }}"
          generate_release_notes: true
          files: |
            artifacts/mdv-setup-x64.exe
            artifacts/mdv-windows-x86_64.zip
            artifacts/mdv-linux-x86_64.tar.gz
            artifacts/checksums.txt
